{% extends 'layouts/base.html' %}

{% block title %}注册 - 知识分享平台{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm mt-5">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">创建账号</h2>
                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱地址</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">设置密码</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-2">注册</button>
                    </div>
                </form>
                <div class="mt-4 text-center">
                    <span class="text-muted">已有账号？</span>
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">返回登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
